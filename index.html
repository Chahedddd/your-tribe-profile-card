<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDND Visitekaartje</title>
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
    
    <article>
      
      <header>
        
        <h1>Chahed Nouaili</h1>
        
        <p class="slogan"><em>Frontend Developer</em></p>
        
        <button>
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="#2c3e50" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <title>Wijzig layout</title>
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M4 8v-2a2 2 0 0 1 2 -2h2"></path>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
            <path d="M16 20h2a2 2 0 0 0 2 -2v-2"></path>
          </svg>
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="1.5" stroke="red" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path d="M15 19v-2a2 2 0 0 1 2 -2h2"></path>
            <path d="M15 5v2a2 2 0 0 0 2 2h2"></path>
            <path d="M5 15h2a2 2 0 0 1 2 2v2"></path>
            <path d="M5 9h2a2 2 0 0 0 2 -2v-2"></path>
          </svg>
        </button>
        
      </header>
  
      <div class="shape"></div>
      <img src="icoon.png">

      <dl>
        <dt>21 jaar</dt>
        <dd>Hoofddorp</dd>
        
        <dt>Nauwkeurig</dt>
        <dd>Observerend & bewust</dd>
        
        <dt>Tunesisch</dt>
        <dd>Mexicaans</dd>
      </dl>
  
      <section class="info">
        <div class="box">
        <h2>Talen</h2>
        <ul>
          <li>Nederlands</li>
          <li>Engels</li>
          <li>Arabisch/Darija</li>
        </ul>
        </div>

        <div class="box">
        <h2>Opleidingen</h2>
        <ul>
          <li>Marketing & Communicatie Specialist niv.4</li>
          <li>Mediamanager niv.4</li>
        </ul>
        </div>
      </section>
      
    </article>

    <script src="scripts/script.js"></script>
    
  </body>
</html>
